# @title ⚙️ Préparation de l'exercice (exécuter d'abord)
import requests

try:
    del actions_configurees
except NameError:
    pass

# ----------------------------------------------------------------
# Saisissez votre nom d'utilisateur GitHub au format prenom-nom
# (ex. : "jean-dupont"), pas l'URL du dépôt
# ----------------------------------------------------------------
github_username = "Kimana319"

REPO = "upjv-python-datascience"

if github_username in ("", "___"):
    print("❌ Remplacez ___ par votre nom d'utilisateur GitHub puis réexécutez cette cellule")
else:
    try:
        r = requests.get(f"https://api.github.com/repos/{github_username}/{REPO}")
        if r.status_code == 200:
            print(f"✅ Dépôt {github_username}/{REPO} trouvé")
        elif r.status_code == 404:
            print(f"❌ Dépôt {github_username}/{REPO} introuvable — vérifiez votre nom d'utilisateur et que le dépôt est public")
        elif r.status_code == 403:
            print("⚠️  Limite de requêtes GitHub atteinte (60/h) — réessayez dans quelques minutes")
        else:
            print(f"⚠️  Erreur API ({r.status_code})")
    except Exception as e:
        print(f"❌ Erreur : {e}")
✅ Dépôt Kimana319/upjv-python-datascience trouvé
