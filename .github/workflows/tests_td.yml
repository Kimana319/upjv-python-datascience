Introduction
Au TD précédent, vous avez appris à versionner votre travail localement avec Git : créer des commits, consulter l'historique, comparer des versions, annuler une erreur. Vos modifications étaient sauvegardées — mais uniquement sur votre propre machine.

Imaginez maintenant que vous travaillez à deux sur un modèle de prévision économique. L'un d'entre vous ajoute des données, l'autre modifie le script. Comment éviter d'écraser le travail de l'autre ? Comment savoir qui a fait quoi, et pourquoi ? Comment partager votre code avec votre directeur de mémoire sans envoyer des fichiers par e-mail ?

C'est exactement ce que GitHub résout.

GitHub est un service d'hébergement dans le cloud qui s'appuie sur Git pour rendre votre travail accessible, collaboratif et traçable. Chaque dépôt que vous créez sur GitHub est une copie distante de votre projet : vous pouvez le partager avec un collègue, recevoir des retours via une Pull Request, ou déclencher automatiquement des vérifications à chaque modification.

Dans ce TD, vous apprendrez à :

créer et configurer un dépôt GitHub pour vos projets de données ;
rédiger un fichier README clair pour présenter votre travail ;
déposer et organiser vos notebooks sur GitHub ;
utiliser les branches pour travailler sans risque sur votre code ;
collaborer via les Issues et les Pull Requests ;
mettre en place les tests automatiques qui vérifieront votre travail à chaque TD.
À l'issue de cette séance, votre dépôt personnel upjv-python-datascience sera configuré et prêt pour toute l'année.

